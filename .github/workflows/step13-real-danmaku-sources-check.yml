name: Step 13 real danmaku sources check

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish src/AsterPlay/AsterPlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish-check

name: WinUI 3 validation

on:
  push:
    branches:
      - winui3-migration
  pull_request:
    paths:
      - "src/AsterPlay.Core/**"
      - "src/AsterPlay.WinUI/**"
      - "build-windows.cmd"
      - "scripts/**"
      - ".github/workflows/winui3-migration-build.yml"
  workflow_dispatch:

concurrency:
  group: winui3-migration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Automatically prepare and build Windows x64 package
        shell: cmd
        run: build-windows.cmd

      - name: Verify WinUI migration package
        shell: pwsh
        run: |
          $publish = Join-Path $PWD "dist\AsterPlay"
          $required = @(
            "AsterPlay.exe",
            "AsterPlay.Core.dll",
            "LiquidGlassWinUI.dll",
            "CustomEffectRuntimeNative.dll",
            "libmpv-2.dll",
            "Assets/AsterPlay.AppIcon.png",
            "Info/RUNTIME-SOURCE.txt",
            "Info/BUILD-INFO.txt"
          )

          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path $publish $name))) {
              throw "Missing WinUI release file: $name"
            }
          }

          $satellites = @(Get-ChildItem -Path (Join-Path $publish 'resources') -Recurse -File -Filter '*.resources.dll' -Force)
          if ($satellites.Count -eq 0) {
            throw "Managed language satellites were not collected under resources."
          }
          Write-Host "WinUI 3 locale packaging verified ($($satellites.Count) satellite DLLs)."

      - name: Smoke start WinUI app
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\AsterPlay\AsterPlay.exe"
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()

          if ($process.HasExited) {
            $asterPlayLog = Join-Path $env:LOCALAPPDATA "AsterPlay\AsterPlay.log"
            if (Test-Path $asterPlayLog) {
              Write-Host "=== AsterPlay.log ==="
              Get-Content -Raw $asterPlayLog | Write-Host
            }
            throw "AsterPlay exited during startup smoke test with code $($process.ExitCode)."
          }

          Stop-Process -Id $process.Id -Force
          Write-Host "AsterPlay WinUI 3 started successfully and stayed alive for 5 seconds."

      - name: Dump WinUI startup diagnostics
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== Recent Application events ==="
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-10) } -ErrorAction SilentlyContinue |
            Select-Object -First 80 TimeCreated, Id, LevelDisplayName, ProviderName, Message |
            Format-List | Out-String -Width 300 | Write-Host

          Write-Host "=== Windows Error Reporting queue ==="
          Get-ChildItem "$env:ProgramData\Microsoft\Windows\WER\ReportQueue" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 100 FullName |
            Format-Table -AutoSize | Out-String -Width 300 | Write-Host

      - name: Upload WinUI migration package
        uses: actions/upload-artifact@v4
        with:
          name: AsterPlay-WinUI-validation-win-x64
          path: dist/AsterPlay
          include-hidden-files: true
          if-no-files-found: error

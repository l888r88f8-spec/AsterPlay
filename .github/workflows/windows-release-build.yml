name: Windows release build

on:
  push:
    branches:
      - main
      - step14-release-hardening
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache portable .NET SDK
        uses: actions/cache@v4
        with:
          path: tools/dotnet
          key: asterplay-dotnet-${{ runner.os }}-8.0.425

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: asterplay-nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            asterplay-nuget-${{ runner.os }}-

      - name: Bootstrap pinned portable .NET 8 SDK
        shell: cmd
        run: bootstrap-dotnet.cmd

      - name: Build LiquidGlass native compatibility runtime
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found."
          }

          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" |
            Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild was not found."
          }

          Write-Host "MSBuild: $msbuild"
          & $msbuild "Native\LiquidGlassCompat\CustomEffectRuntime.Native.vcxproj" `
            -restore `
            -m `
            /p:Configuration=Release `
            /p:Platform=x64
          if ($LASTEXITCODE -ne 0) {
            throw "LiquidGlass native compatibility runtime build failed."
          }

          $native = "Native\LiquidGlassCompat\Output\x64\Release\CustomEffectRuntimeNative.dll"
          if (-not (Test-Path $native)) {
            throw "LiquidGlass native compatibility runtime output is missing."
          }

      - name: Build self-contained Windows x64 package
        shell: pwsh
        run: .\build-windows.ps1

      - name: Verify release package
        shell: pwsh
        run: |
          $publish = Join-Path $PWD "dist\AsterPlay"
          $required = @(
            "AsterPlay.exe",
            "AsterPlay.Core.dll",
                    "libmpv-2.dll",
            "coreclr.dll",
            "hostfxr.dll",
            "hostpolicy.dll",
            "RUNTIME-SOURCE.txt",
            "BUILD-INFO.txt"
          )

          foreach ($name in $required) {
            $path = Join-Path $publish $name
            if (-not (Test-Path $path)) {
              throw "Missing release file: $name"
            }
          }

          $runtime = Get-Content -Raw (Join-Path $publish "RUNTIME-SOURCE.txt")
          if ($runtime -notmatch [Regex]::Escape("mpv-dev-lgpl-x86_64-20260929-git-b4b5d69a44.7z")) {
            throw "Release package does not contain the pinned libmpv build."
          }

          if ($runtime -notmatch [Regex]::Escape("8c80c506cf95f403d8a2b9d672d5f88d965885666f25c850f711a06b9510dfc8")) {
            throw "Pinned libmpv checksum metadata is missing."
          }

          Write-Host "Windows release package verification passed."

      - name: Smoke start packaged app
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\AsterPlay\AsterPlay.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5

          $nativeGlassLog = Join-Path $env:LOCALAPPDATA "AsterPlay\LiquidGlassNative.log"
          if (Test-Path $nativeGlassLog) {
            Write-Host "=== LiquidGlassNative.log ==="
            Get-Content -Raw $nativeGlassLog | Write-Host
          }

          $asterPlayLog = Join-Path $env:LOCALAPPDATA "AsterPlay\AsterPlay.log"
          if (Test-Path $asterPlayLog) {
            $liquidGlassLines = @(Select-String -Path $asterPlayLog -Pattern "LiquidGlass:" -SimpleMatch)
            if ($liquidGlassLines.Count -gt 0) {
              Write-Host "=== LiquidGlass diagnostics ==="
              $liquidGlassLines | ForEach-Object { Write-Host $_.Line }
              if ($liquidGlassLines.Line -match "LiquidGlass: ERROR") {
                throw "LiquidGlass compositor effect reported an initialization error."
              }
            }
          }

          if ($process.HasExited) {
            if (Test-Path $asterPlayLog) {
              Write-Host "=== AsterPlay.log ==="
              Get-Content -Raw $asterPlayLog | Write-Host
            }

            Write-Host "=== Recent Application events ==="
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-10) } -ErrorAction SilentlyContinue |
              Select-Object -First 80 TimeCreated, Id, LevelDisplayName, ProviderName, Message |
              Format-List | Out-String -Width 300 | Write-Host

            Write-Host "=== Windows Error Reporting queue ==="
            Get-ChildItem "$env:ProgramData\Microsoft\Windows\WER\ReportQueue" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 100 FullName |
              Format-Table -AutoSize | Out-String -Width 300 | Write-Host

            throw "AsterPlay exited during startup smoke test with code $($process.ExitCode)."
          }

          Stop-Process -Id $process.Id -Force
          Write-Host "Packaged AsterPlay started successfully and stayed alive for 5 seconds."

      - name: Pin verified LiquidGlass native runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git fetch origin main
          $remoteHead = (git rev-parse origin/main).Trim()
          $currentHead = (git rev-parse HEAD).Trim()
          if ($remoteHead -ne $currentHead) {
            Write-Host "main advanced to $remoteHead while this run was executing; skipping native runtime pin from $currentHead."
            exit 0
          }

          $source = "Native\LiquidGlassCompat\Output\x64\Release\CustomEffectRuntimeNative.dll"
          $directory = "Native\LiquidGlassCompat\Prebuilt\win-x64"
          $destination = Join-Path $directory "CustomEffectRuntimeNative.dll"
          $hashFile = Join-Path $directory "SHA256.txt"

          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          Copy-Item $source $destination -Force

          $hash = (Get-FileHash -Algorithm SHA256 $destination).Hash.ToLowerInvariant()
          @(
            "CustomEffectRuntimeNative.dll"
            "Target: Windows App SDK 2.5.1"
            "Architecture: x64"
            "SHA256: $hash"
            "Verified by Windows release build + startup smoke test."
          ) | Set-Content -Encoding UTF8 $hashFile

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $destination $hashFile

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Pinned LiquidGlass runtime is already current."
          }
          else {
            git commit -m "Pin verified SDK 2.5 LiquidGlass runtime [skip ci]"
            git push origin HEAD:main
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: AsterPlay-win-x64
          path: dist/AsterPlay
          if-no-files-found: error
